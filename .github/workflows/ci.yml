name: CI

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/loidolt/karakeep-agent-mcp
  UV_VERSION: "0.9.22"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run pytest -v

  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Karakeep releases the tools are verified against.
        karakeep: ["0.34.1"]
    services:
      meilisearch:
        image: getmeili/meilisearch:v1.55.0
        env:
          MEILI_NO_ANALYTICS: "true"
          MEILI_MASTER_KEY: ci-only-meili-master-key
      karakeep:
        image: ghcr.io/karakeep-app/karakeep:${{ matrix.karakeep }}
        ports: ["3010:3000"]
        env:
          DATA_DIR: /data
          NEXTAUTH_URL: http://localhost:3010
          NEXTAUTH_SECRET: ci-only-nextauth-secret
          MEILI_ADDR: http://meilisearch:7700
          MEILI_MASTER_KEY: ci-only-meili-master-key
          DISABLE_NEW_RELEASE_CHECK: "true"
        options: >-
          --tmpfs /data
          --health-cmd "curl -fsS http://127.0.0.1:3000/api/health"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --locked
      - name: Create Karakeep user and API key
        run: uv run python dev/bootstrap_karakeep.py --url http://localhost:3010 --github-env
      - name: Integration tests
        run: uv run pytest -m integration -v
        env:
          KARAKEEP_IT_URL: https://en.wikipedia.org/wiki/Bookmark_(digital)
      - name: Container smoke test (bearer auth over streamable HTTP)
        run: |
          docker build -t karakeep-agent-mcp:ci .
          token=$(openssl rand -hex 32)
          docker run -d --name mcp --network host \
            -e KARAKEEP_URL=http://localhost:3010 -e KARAKEEP_API_KEY \
            -e KARAKEEP_MCP_AUTH_MODE=bearer -e KARAKEEP_MCP_BEARER_TOKENS="$token" \
            karakeep-agent-mcp:ci
          for i in $(seq 1 30); do curl -fsS http://localhost:8000/healthz && break; sleep 1; done
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8000/mcp -d '{}')
          test "$code" = 401
          uv run python dev/smoke_http.py http://localhost:8000/mcp "$token"
      - if: failure()
        run: docker logs mcp || true

  image:
    needs: [lint, test, integration]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          # Release tags v1.2.3 -> 1.2.3, 1.2, 1 and latest (latest only for
          # non-prerelease versions). Nothing is pushed for branches or PRs.
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
