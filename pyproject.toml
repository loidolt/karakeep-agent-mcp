[project]
name = "karakeep-agent-mcp"
version = "0.1.0"
description = "A curated, security-minded remote MCP server for Karakeep (bookmarks, read-later, notes)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "loidolt", email = "loidolt@gmail.com" }
]
requires-python = ">=3.12"
keywords = ["mcp", "karakeep", "hoarder", "fastmcp", "bookmarks", "read-later", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]
dependencies = [
    "fastmcp==4.1.5",
    "httpx==0.28.1",
    "pydantic-settings==2.16.2",
]

[project.urls]
Homepage = "https://github.com/loidolt/karakeep-agent-mcp"
Issues = "https://github.com/loidolt/karakeep-agent-mcp/issues"
Changelog = "https://github.com/loidolt/karakeep-agent-mcp/blob/main/CHANGELOG.md"

[project.scripts]
karakeep-agent-mcp = "karakeep_agent_mcp.server:main"

[build-system]
requires = ["uv_build>=0.9.22,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy==2.4.1",
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1.post1",
    "respx==0.23.1",
    "ruff==0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "ASYNC"]
ignore = ["S101"]  # asserts are fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S104", "S105", "S106"]
"dev/**" = ["S105"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["karakeep_agent_mcp"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["respx.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "integration: needs a running Karakeep (KARAKEEP_URL and KARAKEEP_API_KEY set)",
]
addopts = "-m 'not integration'"
